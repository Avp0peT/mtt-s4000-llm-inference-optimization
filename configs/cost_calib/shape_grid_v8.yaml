# 成本模型标定的形状网格（**协议 v8**）—— **补小 chunk 的第三个点 pf192**
#
# ⚠️ **v8 的变更理由**（采数**之前**登记，由 OPT-03/B4 的缺口指出、不是我猜的）：
#
# `OPTIMIZATION_ROADMAP_SESSIONS.md` §5「B4」点名要补 **128/192/256** 三个小 chunk
# 采样点（EVIDENCE_INDEX 缺口 3）。B4 前置核查（OPT-03）读 `model_v7.json` 发现：
#
#     pf128 有 **8** 个键、pf256 有 **8** 个键、**pf192 = 0 个键**（数据里 prefill 轴
#     是 [0,128,256,512,1024,2048]，**从没出现过 192**）。
#
# ⇒ 128/256 在 v7 就已经可预测（B4 已证：两会话 32 条、会话内重复性中位 0.07%、
#    部署表对已采形状 **100%** 命中）；**缺的只有 192**。
#
# ⇒ **v8 只改一处**：把 `mixed_small_chunk.prefill_tok` 从 `[128, 256]` 扩到
#    `[128, 192, 256]`。**不动**别的（batch 仍 {1,2,4,8}、kv 仍 {1024,2048}、
#    其余三组逐字沿用 v7）。
#    ⇒ 新增 4 batch × 1 pf × 2 kv = **8 个点**。
#
# ⚠️ 为什么**另开 v8** 而不是原地改 v7（这条是网格自己的纪律）：
#    "看到结果之后再加密采样点，就会把'事后挑形状'混进来 ⇒ 要加密必须另开一轮（v2）并说明"。
#    且原地改 v7 会让 `grid_sha256` 变 ⇒ 已采的 `model_v7.json` 记录的
#    `grid_sha256: 5c3b66f75c89522c` 与之失配 ⇒ 血缘断。
#
# ⚠️ 可证伪的预期（采完必须核，不达标要如实记）：
#    ① pf192 的实测值应落在 **pf128 与 pf256 之间**（同 batch、同 kv）；
#       若落到区间外，说明小 chunk 在 pf 维**非单调** —— 那正是 COST_PROFILE 记录
#       过的 batch 非单调（b3>b4）的同类风险，会直接影响"能否内插"的结论。
#    ② pf192 的会话内重复性应 ≤ pf128/pf256 的水平（≤0.23%）。
#
# ⚠️ 与 v7 的关系：v8 是 v7 的**超集**（多 8 个点）⇒ v7 的 220 条记录**全部**仍是
#    v8 的合法子集。**但不得跨会话并表**（COST_PROFILE §6）⇒ v8 的键仍只从
#    **v8 自己的会话**建；B4 的"能"结论也只对 v7 已采的 128/256 成立。
#
# 成本模型标定的形状网格（**协议 v6**）—— **修"执行状态描述"的口径错**
#
# ⚠️ **v6 的变更理由**（采数**之前**登记）——这是本轮**最严重**的一个错，而且它
#    **不会因为加密网格而自愈**：
#
# 实测发现：**同一列 `prefill_tok`，两侧含义不同**。
#   * **标定探针**（v1..v5 的 `mixed_serving`）：`ids = (batch, n_new)` 且 `n_new = prefill_tok`
#     ⇒ **每条序列各做 `prefill_tok` 个新 token** ⇒ 全步 **`batch` × `prefill_tok`**；
#   * **harness**：`step_planner.tokens_prefilled` 是"本步发放的 prefill token **总数**"，
#     遥测 `note` 逐字如 `prefill_tok=512 decode=7` ⇒ **512 是总量、给一条请求**。
#
#   实证：模型算出的 `b2/pf512` = **286.8 ms**、`b8/pf512` = **1004.8 ms**
#   ⇒ 明显偏高（差约 `batch` 倍），因为标定把"总量"当成"每条的量"去测了。
#
# ⇒ **v6 把 `mixed_serving` 的 `n_new_mode` 设为 `real_mixed`**：
#   一条序列承担 `prefill_tok` 个新 token、其余 `batch-1` 条各只做 **1** 个
#   —— 与 harness 的真实结构一致。
#   `pure_decode` **不动**（那里两边都是 1 个新 token，口径本来就一致）。
#   其余（batch 1..8、kv 上界 2048、覆盖率缺口的补点）沿用 v5。
#
# ⚠️ 可证伪的预期：**`mixed_serving` 一族的成本应显著下降**（约 `batch` 倍量级），
#    并且用它算出来的"整步成本"应当与**遥测实测的步时长**对得上
#    （可用 `scripts/decompose_step_overhead.py` 的手法核对）。
#
# 成本模型标定的形状网格（**协议 v5**）—— **按实测覆盖率缺口补点**
#
# ⚠️ **v5 的变更理由**（采数**之前**登记，且**由测量指出缺口、不是我猜的**）：
# 第 14 步把模型形态改成"查表 + 保守回退"后，实测了**分桶查表的覆盖率**
# （`scripts/sweep_lookup_buckets.py` + `check_model_coverage.py --replay-mode`）：
#
#     kv 桶 256 ⇒ 覆盖 **53.57%**、保守高估 p95 仅 **0.13%**
#     按 batch 分解：b4 100% / b8 66.7% / b7 57.9% / b2 50% / **b5 = 0% / b6 = 0%**
#
# ⇒ **b5/b6 一条都不中**，原因是：它们的 `prefill ∈ {512, 1024}` 配 `kv ≈ 1536`
#    （桶化后 1536），而 v4 网格里这两个 `prefill` **只在 `kv=1024` 有**
#    ⇒ 缺的正是"**混合形状 × kv 1536/2048**"。
#
# ⇒ **v5 只改一处**：`mixed_serving` 的 `kv_len` 从 `[1024]` 扩到 **`[1024, 1536, 2048]`**
#    （8 段 × 2 prefill × 3 kv = 48 点，v4 是 16 点）⇒ 总 94 点。
#    **不动**别的：`batch` 仍 1..8、`kv` 上界仍 2048、`pure_decode` 仍只服务"kv 可辨识性"。
#
# ⚠️ 可证伪的预期：**覆盖率应从 53.57% 升到接近 100%**，且**保守代价仍低**
#    （因为新增点正好落在 b5/b6 缺的那一格里）。采完必须核；
#    若覆盖率没上去，说明缺口判断错了，要如实记。
#
# 成本模型标定的形状网格（**协议 v4**）—— 判据可辨识性修复
#
# ⚠️ **v4 的变更理由**（采数**之前**登记）：
# 用**同一份数据换更严的留出**重算，v1 与 v3 **双双崩到 ~95%**：
#
#     数据集        训练点/段   1-in-4（预注册）   1-in-2（放大）
#     v1 (72 条)     13.5           1.77%            **95.25%**
#     v3 (92 条)     ~7             5.15%            **95.26%**
#
# ⇒ 结论：**"1.77% 低估"不是泛化能力，是特定划分的运气**。
# ⇒ 真因（可辨识性）：每段的超平面有 **3 个参数**，而网格里 `kv_len` **只有 3 个取值**
#    （512/1024/2048）⇒ 留出一半后，每段在每个 kv 值上只剩 ~1.5 个训练点
#    ⇒ **kv 维上不可辨识** ⇒ 斜率乱跑 ⇒ 90%+ 的误差。
#
# ⇒ **v4 做两件事**：
#    ① `pure_decode` 的 `kv_len` 从 3 个值加密到 **5 个**（512/768/1024/1536/2048）
#       ⇒ 每段 5 个 kv 点，斜率可辨识；
#    ② **划分改成 1-in-3**（每段约 2/3 进训练）—— 这一条同样是**采数之前**登记的，
#       并且**必须同时报 leave-one-batch-out** 作为更严的次级指标。
#    **不动**：`batch` 仍 1..8；`kv` 上界仍 2048；`mixed_serving` 仍只用 kv=1024
#    （prefill 效应由它承担，kv 的可辨识性由 `pure_decode` 承担）。
#
# 成本模型标定的形状网格（**协议 v3**）—— 第 14 步的模型覆盖修复
#
# ⚠️ **v3 的变更理由**（按预注册：改采样点必须另开一轮并说明，且必须**在采数之前**）：
# 第 14 步实测发现 v1 网格**在 `batch` 维上离散**（只有 {1,2,4,8}），而真实服务的 batch
# **连续取 1..8**。对第 14 步真实轨迹的形状普查（`S14B1`+`S14B2` 的 cost 臂候选，280 个）：
#
#     batch=8:120  batch=7:95  batch=5:30  batch=2:20  batch=6:10  batch=4:5
#     prefill_tok: 0:150  512:120  1024:10
#
# ⇒ **batch ∈ {5,6,7} 共 135 个（48%）根本不在网格里**；且 `batch=2` 的 `prefill_tok`
#    范围是 `[0,0]`（**该格没有 prefill 点** —— 第 11 步登记过的空洞）⇒ `(2,512)`/`(2,1024)`
#    也越界。实测后果：`cost` 臂在 `fixed` 格上**有效工作覆盖率只有 51.35%**，
#    回退成因里 **94.4% 是"batch 不在网格"** ⇒ 四臂对比无法归因到成本模型。
#
# ⇒ **v3 做两件事**：① `batch` 展开为 **1..8 全部**；② 给 `batch≥2` **补上 prefill 点**。
#    ⇒ 覆盖真实可能的形状全集（`max_num_seqs=8` ⇒ batch 不可能超过 8）。
#    **不动**的：`kv_len` 上界仍是 **2048**（v2 已实测：线性 basis 扩到 4096 会把
#    形状留出的低估 p95 从 1.77% 打崩到 18.04% ⇒ 扩 kv 必须先换 basis，不在本轮）。
#
# 成本模型标定的形状网格（**协议 v1**）—— 第 11 步
#
# ⚠️ 这份文件的取值点是**先定的**：第 11 步的验收要求"预先登记新的采集协议与版本"。
# 看到结果之后再加密采样点，就会把"事后挑形状"混进来 ⇒ 要加密必须另开一轮（v2）并说明。
#
# 为什么是这些维度：模型要预测的是**真实服务步**的成本，而本项目的执行形状由
# `benchmark/real_backend.py` 决定 —— 一步里同时有若干条序列做 decode、外加一条
# 序列的一个 prefill 块（chunked prefill）。所以三个自变量就是
# (batch = 正在解码的序列数, prefill_tok = 本步的 prefill token 数, kv_len = 上下文长度)，
# 再加上"一步里有几个串行前向"。
#
# ⚠️ 与 `COST_PROFILE_S4000.md` 的关系：那份报告给的是**快态平台值**（async 块最小值），
# 它只是**性能下界参考**。验收明确要求"SLO 预测须覆盖真实服务协议，不能只拟合快态最小值"
# ⇒ 被拟合的是块 B。

protocol_version: cost-calib-v8

#: 三个自变量各自的取值域（网格的边界，不全是采样点）。
axes:
  batch: [1, 2, 3, 4, 5, 6, 7, 8]   # v3：展开为全部可能值（max_num_seqs=8 ⇒ 上界就是 8）
  prefill_tok: [0, 128, 192, 256, 512, 1024, 2048]   # 0 = 纯 decode；v7 新增 128/256；**v8 新增 192**（B4 要求 128/192/256 齐，v7 缺 192）
  kv_len: [0, 512, 768, 1024, 1536, 2048]  # 上下文长度；v4 加密到 5 个取值（可辨识性）；0 只在纯 prefill 组用

#: 四个采样组。每组写明**为什么要有它**（否则没人敢删也没人敢加）。
groups:
  - id: mixed_small_chunk
    why: "**D1 的小 chunk 验证**：判据是「预测整步 ≤ 每步预算」，而 512 的 prefill 步在该预算下
      预测超限；若候选集里没有更小的块，控制器只能在「降级取最省」与「回退阈值」之间走。
      本组为「小候选能不能被预测」提供**实测键** —— `lookup` 下没有键就等于不能预测。
      **v8 补齐 192**：B4 核查发现 v7 只有 128/256（192 键数 = 0），而任务书点名 128/192/256。
      ⚠️ 采它请用 `fwd_costcalib_probe.py --only-group mixed_small_chunk`
      （**不要**用 `--limit`：`expand()` 是按 key 排序的，`--limit` 取不到这一组）。"
    batch: [1, 2, 4, 8]
    prefill_tok: [128, 192, 256]
    kv_len: [1024, 2048]
    n_forwards: [1]
    n_new_mode: real_mixed

  - id: pure_prefill
    why: 纯 prefill 的每步成本（无 decode 叠加）⇒ prefill 项的形状依赖
    batch: [1]
    prefill_tok: [512, 1024, 2048]
    kv_len: [0]
    n_forwards: [1]

  - id: pure_decode
    why: 纯 decode 的每步成本随 batch 与 kv 的变化 ⇒ decode 项与 KV 项。**v4：kv 加密到 5 个取值**（3 个取值下斜率不可辨识 —— 见文件头的实测）
    batch: [1, 2, 3, 4, 5, 6, 7, 8]
    prefill_tok: [0]
    kv_len: [512, 768, 1024, 1536, 2048]
    n_forwards: [1]

  - id: mixed_serving
    why: "**真实服务步** = decode 与 prefill 同时（chunked prefill 的核心形状）；v3 把 batch 展开到 1..8 —— 真实轨迹里它是 ≤8 的**任意**值（5/6/7 占 48%），而 v1 的 {1,4,8} 完全没覆盖"
    batch: [1, 2, 3, 4, 5, 6, 7, 8]
    prefill_tok: [512, 1024]
    kv_len: [1024, 1536, 2048]   # v5：按覆盖率缺口补 1536/2048（b5/b6 一条都不中就是缺这两列）
    n_forwards: [1]
    # ★ v6：**真实结构**——一条序列承担 prefill_tok、其余各 1 个新 token
    #（与 harness 的 `tokens_prefilled` 口径一致；旧口径是"每条都做"，差约 batch 倍）
    n_new_mode: real_mixed

  - id: serial_forward_group
    why: 实际一步里可能有多个**串行**前向（`telemetry.note` 的 `forwards=` 字段）⇒ 测加和性，决定模型是"按前向数线性"还是"按步"
    batch: [1]
    prefill_tok: [1024]
    kv_len: [1024]
    n_forwards: [1, 2, 3, 4]

#: 两个采集块。**分开采、分开报**（预注册 §二）。
blocks:
  A:
    name: fast_state_platform
    method: async_chunk          # 连续提交 n 次、块尾 sync 一次 ⇒ 占空比 ~100%
    duty_cycle: "~100%"
    block_n: 20
    n_blocks: 3
    take: block_min              # 取**块最小值**为该格快态平台值（COST_PROFILE §4）
    role: lower_bound_only       # ⚠️ 只作性能下界参考，**不得用于拟合**
  B:
    name: service_protocol
    method: mimic_harness_step   # 复刻 harness 的逐步 sync + 真实 KV 生长（v5 的 S5 MIMIC 协议）
    duty_cycle: "~85%"
    warmup_calls: 30             # 吸收一次性编译 + autotune 微调（COST_PROFILE §4）
    n_calls: 40
    role: fitted                 # **被拟合的是这个**

#: 必须一起记录的量（缺了就无法事后判断"测的是什么条件"）。
record:
  - per_call_device_ms          # 块 A：块总时长 / n
  - per_call_wall_ms            # 块 B：逐步墙钟（**含** python 间隙与提交成本）
  - submit_cost_ms              # 主机提交成本（b1 中位 75.25 ms、b2 88.45 ms，与设备同量级）
  - duty_cycle_actual           # 实测占空比（它是性能态的开关）
  - n_forwards                  # 本步有几个串行前向
  - session_id
  - block_index / call_index    # 保留原始序列，便于事后重算（不只存汇总）

#: 会话与划分（预注册 §三）。**跨会话不得并表**（COST_PROFILE §6：绝对值漂移 1.3–4%）。
#: **划分规则也属于协议**（v4 新增字段）：`hash_modulus=3` ⇒ 1/3 进留出。
#: ⚠️ 改成 3 的理由见文件头（1-in-4 的 1.77% 是运气，1-in-2 会崩到 95%）。
#: 老网格（v1/v2/v3）没有这个字段 ⇒ 拟合脚本按默认 4 处理，**行为逐字节不变**。
split:
  hash_modulus: 3
  also_report:
    - leave_one_batch_out      # 更严的次级指标：整块留出一个 batch，看跨 batch 可迁移性

session:
  id_scheme: "<UTC 时间戳>-<hostname 前 8 位>-<git short>-<序号>"
  cross_session_merge: forbidden
  split_unit: [shape, session]   # ⚠️ **不是**相邻步；按形状/会话**整块**留出
  forbidden_split:                   # ⚠️ **必须是列表**（写成字符串会被逐字符拆开，见校验里的同名守卫）
    - stepwise_random                # 同一 session 的相邻步同批、同 KV 段、同性能态 ⇒ 随机切分会让留出集"见过邻居"
    - adjacent_step
    - step

#: 指纹（预注册 §七）。加载模型时**逐项比对，不符即拒**。
fingerprint:
  hardware: {device_model: "MTT S4000", driver_version: "2.7.0", gmi_version: "1.14.0"}
  software: {torch: "2.2.0", torch_musa: "1.3.0+81caf0a", transformers: "4.46.3", python: "3.10.8"}
  model: {id: "Qwen/Qwen2.5-7B-Instruct", revision: "a09a35458c702b33eeacc393d103063234e8bc28"}
  precision: fp16
