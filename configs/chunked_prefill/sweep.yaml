# 扫描定义（探索用，不是结论）
# ---------------------------
# 目的：确定「chunk_size 的最优值不是常数」这一假设是否成立，
# 并圈定值得做重复实验的区间。
#
# 用法：
#   python benchmark/sweep.py --sweep configs/chunked_prefill/sweep.yaml
#
# 注意：扫描点各只跑 1 次，产物只能用于圈区间；
# 选定配置后必须用 configs/chunked_prefill/chunked_4k.yaml 跑 >=3 次重复。

name: chunk_size_sweep
base_config: configs/chunked_prefill/chunked_4k.yaml
dry_run: true        # 上真机前请显式改成 false，并确认机器独占

grid:
  chunk.policy:
    - fixed_chunk
    - decode_priority_chunk
    - queue_aware_chunk
  chunk.chunk_size:
    - 512
    - 1024
    - 2048
    - 4096
    - 8192

# 待验证的假设（跑完回来对照，不要事后编故事）：
#   H1: 在 long_context_qa 下，chunk_size 存在一个使 TPOT P99 最小而 TTFT 恶化的
#       幅度可接受的最优点，该点在 1024~4096 区间内。
#   H2: decode_priority_chunk 相对 fixed_chunk 的收益随 chunk_size 增大而增大
#       （因为大 chunk 对 decode 的挤占更严重）。
#   H3: 拥塞场景（mixed_burst）下最优 chunk_size 小于非拥塞场景
#       （对应 queue_aware_chunk 的设计前提）。
