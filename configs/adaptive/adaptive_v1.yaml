# 配置说明
# ---------
# 变量（相对 configs/chunked_prefill/chunked_4k.yaml）：
#   controller.enabled: false -> true
#   并新增三个**信号阈值**键：cache_hit_rate_high /
#   min_available_memory_mb / critical_available_memory_mb。
#   它们决定控制器是否消费 s_t 的非时延分量（缓存命中率、可用显存）。
#   在本配置下这三个信号**测不到**（cache.enabled=false、离线路径无显存读数），
#   因此阈值虽然写了，运行期不会触发任何否决——这一点必须写在配置里，
#   否则事后看到"阈值配了但没生效"会误判成实现有 bug。
#   取值为待标定的占位值：上真机后必须按实际 HBM 容量与命中率分布重标，
#   标定前不要据这三个数报结论。
#
# 目标：不再依赖人工调参，让 chunk 与批预算随负载变化自动调整。
#
# 评估这个方案时，最容易犯的错是只看「平均 TPOT 变好了」。
# 真正要回答的是三件事：
#   1) SLO 达标率与达标吞吐是否提升（这是设计目标，不是平均时延）
#   2) 控制器是否振荡 —— 用 controller_trace 数 n_updates 与 n_skipped_cooldown，
#      振荡会在 telemetry 里表现为 chunk_size 的高频来回跳
#   3) 相对最优静态配置是否仍有差距 —— 若人工扫参能轻松打败自适应，
#      那这套控制器的复杂度就没有回报（这是必须正视的负面结论）
#
# 另外两个必查项（都比"平均时延好不好看"更容易被漏掉）：
#   4) 「建议值 vs 生效值」：meta 的 controller_effect 里，chunk_requested 与
#      chunk_effective 的差额应当为 0；不为 0 说明决策被某个闸门静默压回了。
#   5) 恢复路径：负载回落后 n_decisions_recover > 0，且 chunk/token 回到配置初值。
#      若 n_decisions_recover 恒为 0，控制器就是一根只会收紧的棘轮。

run:
  repeats: 3
  warmup_s: 30
  control_interval_steps: 8
  slo:
    ttft_ms: 2000
    tpot_ms: 50
  notes: "自适应控制器 v1"

workload:
  name: mixed_burst       # 异质负载：自适应才有发挥空间

scheduler:
  policy: continuous_batching
  max_num_seqs: 32
  reserve_decode_slots: 1

chunk:
  # 起手值：控制器会在此基础上调整，因此这里的数值只影响前几步
  policy: decode_priority_chunk
  enabled: true
  chunk_size: 4096
  max_num_batched_tokens: 8192
  decode_reserve_ratio: 0.0
  min_decode_seqs: 1

cache:
  enabled: false
  block_size: 16
  max_blocks: 8192
  eviction: lru
  min_reuse_blocks: 1

controller:
  enabled: true
  target_tpot_ms: 50.0
  target_ttft_ms: 2000.0
  hysteresis: 0.10          # 带宽太窄 -> 抖动在阈值附近；太宽 -> 反应迟钝
  # 冷却：两次调整之间至少隔多少个**观测周期**（一次决策 = 一个周期）。
  # 单位不是推理步——决策节拍由 run.control_interval_steps 决定，控制器不再重复知道它。
  # 扫参时优先调它，但先确认它真的会触发：看 controller_trace 里的
  # `steps_since_last_decision`（应等于 control_interval_steps）与 state.n_skipped_cooldown。
  cooldown_cycles: 3
  chunk_size_init: 4096
  chunk_size_min: 512
  chunk_size_max: 16384
  chunk_size_step: 512
  max_batched_tokens_init: 8192
  max_batched_tokens_min: 2048
  max_batched_tokens_max: 32768
  max_batched_tokens_step: 1024
  # 非时延反馈信号的阈值。None（或不写）= 该信号不参与决策。
  cache_hit_rate_high: 0.5          # 命中率 ≥ 此值 -> 不为 TTFT 放大分块（占位值，待标定）
  min_available_memory_mb: 8192     # 可用显存 < 此值 -> 否决放大（占位值，待标定）
  critical_available_memory_mb: 4096  # 可用显存 < 此值 -> 主动收缩（占位值，待标定）

device_model:
  step_overhead_ms: 2.0
  prefill_tok_per_ms: 6.0
  decode_base_ms: 1.0
  decode_per_seq_ms: 0.06
  max_steps: 200000

runtime:
  model: "Qwen2.5-7B-Instruct"   # 规范第 4 节：起步用 Qwen 系 7B~8B Dense
  model_revision: "main"
  precision: bf16
  graph_mode: eager
  tensor_parallel_size: 1
  kv_cache_dtype: auto
