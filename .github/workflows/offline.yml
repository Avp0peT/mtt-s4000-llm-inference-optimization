name: Offline core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: CPU-independent core tests (not MUSA acceptance)
        run: python -m pytest tests/test_workload.py tests/test_metrics.py tests/test_controller_gate_mode.py tests/test_execution_shape.py tests/test_cost_execution_contract.py -q -k "not TestExecutionShapeRealCpu"
      - name: Execution-shape plan only
        run: python scripts/execution_shape_probe.py --manifest results/processed/execution_shape_manifest_20261003.json --dry-plan
